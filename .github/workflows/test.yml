name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node tests/test_solver_core.js
      - run: node tests/test_probability_core.js
      - run: node tests/test_background_integration.js
      - run: python tests/e2e_ui.py
      - run: python tests/e2e_extension.py
